version: '3'

volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend/
    env_file: .env
    depends_on:
      - db
    volumes:
    - static_volume:/app/static_backend
    - media_volume:/app/media
  frontend:
    build: ./frontend/
    command: sh -c "cp -r /app/build/* /static/ && tail -f /dev/null"
    volumes:
      - static_volume:/static
    restart: unless-stopped
  gateway:
    build: ./nginx/
    env_file: .env
    depends_on:
      - backend
      - frontend
    ports:
      - 9000:80
    volumes:
      - static_volume:/static
      - media_volume:/media
