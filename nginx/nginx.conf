server {
  listen 80;
  index index.html;
  server_tokens off;
  
  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }
  location /static/admin/ {
    alias /static_backend/admin/;
  }
  location /static/rest_framework/ {
    alias /static_backend/rest_framework/;
  }
  location /media/ {
    alias /media/;
  }
  location / {
    root /static;
    try_files $uri $uri/ /index.html;
  }
}