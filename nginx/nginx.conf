server {
  listen 80;
  index index.html;
# server_tokens off прописан в главном файле сервера

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }
  location /static/ {
    alias /static/;
  }
  location /media/ {
    alias /media/;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
